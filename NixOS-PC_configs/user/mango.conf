env=WLR_RENDERER,vulkan

# PC: single HDR monitor exposed as DP-1/DP-4 between boots,
# so match any DP-* output to keep 280Hz/HDR/VRR consistent.
monitorrule=name:^DP-,width:2560,height:1440,refresh:280,x:0,y:0,scale:1,vrr:1,hdr:1,hdr_force:1,hdr_max_lum:400,hdr_max_avg_lum:400

# --- Hyprland-style keybinds (mirror hyprland config; keysym so layout matches) ---

# Apps
binds=SUPER,Return,spawn,alacritty
binds=SUPER,w,spawn,GDK_SCALE=1 GDK_DPI_SCALE=1 MOZ_ENABLE_WAYLAND=1 zen
binds=SUPER,s,spawn,env LD_PRELOAD=/usr/lib/spotify-adblock.so GDK_SCALE=1 GDK_DPI_SCALE=1 spotify
binds=SUPER,g,spawn,GDK_SCALE=1 GDK_DPI_SCALE=1 steam
binds=SUPER,d,spawn,GDK_SCALE=1 GDK_DPI_SCALE=1 discordcanary
binds=SUPER,Tab,spawn,wofi --show drun
binds=SUPER,F3,spawn,timestamp=$(date +'%Y-%m-%d_%H-%M-%S') ; grim -g "$(slurp)" "$HOME/Pictures/Screenshots/$timestamp.png" ; swappy -f "$HOME/Pictures/Screenshots/$timestamp.png"

# Window management
binds=SUPER,q,killclient
binds=SUPER,f,togglemaximizescreen
binds=SUPER+SHIFT,r,reload_config
binds=SUPER+SHIFT,q,quit

# Focus / swap / resize
binds=SUPER,Left,focusdir,left
binds=SUPER,Right,focusdir,right
binds=SUPER,Up,focusdir,up
binds=SUPER,Down,focusdir,down
binds=SUPER+SHIFT,Left,exchange_client,left
binds=SUPER+SHIFT,Right,exchange_client,right
binds=SUPER+SHIFT,Up,exchange_client,up
binds=SUPER+SHIFT,Down,exchange_client,down
binds=SUPER+CTRL+SHIFT,Left,resizewin,-15,0
binds=SUPER+CTRL+SHIFT,Right,resizewin,+15,0
binds=SUPER+CTRL+SHIFT,Up,resizewin,0,-15
binds=SUPER+CTRL+SHIFT,Down,resizewin,0,+15

# Tags (workspaces)
binds=SUPER,1,view,1
binds=SUPER,2,view,2
binds=SUPER,3,view,3
binds=SUPER,4,view,4
binds=SUPER,5,view,5
binds=SUPER,6,view,6
binds=SUPER,7,view,7
binds=SUPER,8,view,8
binds=SUPER,9,view,9
binds=SUPER+SHIFT,1,tag,1,0
binds=SUPER+SHIFT,2,tag,2,0
binds=SUPER+SHIFT,3,tag,3,0
binds=SUPER+SHIFT,4,tag,4,0
binds=SUPER+SHIFT,5,tag,5,0
binds=SUPER+SHIFT,6,tag,6,0
binds=SUPER+SHIFT,7,tag,7,0
binds=SUPER+SHIFT,8,tag,8,0
binds=SUPER+SHIFT,9,tag,9,0

# Media keys & backlight (raw keycodes, layout-independent)
bind=NONE,XF86AudioRaiseVolume,spawn,wpctl set-volume @DEFAULT_SINK@ 5%+
bind=NONE,XF86AudioLowerVolume,spawn,wpctl set-volume @DEFAULT_SINK@ 5%-
bind=NONE,XF86AudioMute,spawn,wpctl set-mute @DEFAULT_SINK@ toggle
bind=NONE,XF86MonBrightnessUp,spawn,brightnessctl s +5%
bind=NONE,XF86MonBrightnessDown,spawn,brightnessctl s 5%-
